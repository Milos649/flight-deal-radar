name: Flight Deal Radar Daily ETL

on:
  schedule:
    - cron: '0 7 * * *'  # Minden nap 08:00 CET (07:00 UTC)
  workflow_dispatch:
    inputs:
      search_region:
        description: 'Keresési régió (AUTO_ROTATE, ITALY, GREECE, SPAIN, EUROPE, vagy ITALY,SPAIN)'
        required: false
        default: 'AUTO_ROTATE'
        type: choice
        options:
          - AUTO_ROTATE
          - ITALY
          - GREECE
          - SPAIN
          - EUROPE
          - ITALY,GREECE,SPAIN

jobs:
  run-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Repository klónozása
        uses: actions/checkout@v4

      - name: Python 3.12 beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Függőségek telepítése
        run: pip install -r requirements.txt

      - name: Unit tesztek futtatása
        run: python -m unittest discover -s tests -v

      - name: SQLite adatbázis (data/flights.db) visszatöltése Cache-ből
        uses: actions/cache@v4
        with:
          path: data/flights.db
          key: flights-db-${{ github.run_id }}
          restore-keys: |
            flights-db-

      - name: ETL Pipeline futtatása
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEARCH_REGION: ${{ github.event.inputs.search_region || 'AUTO_ROTATE' }}
        run: python main.py