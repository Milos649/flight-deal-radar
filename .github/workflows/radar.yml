name: Flight Deal Radar Daily ETL

on:
  schedule:
    - cron: '0 7 * * *'  # Minden nap 08:00 CET (07:00 UTC)
  workflow_dispatch:
    inputs:
      search_region:
        description: 'Régió (AUTO_ROTATE, ITALY, GREECE, SPAIN, ROMANIA, PORTUGAL, FRANCE, UK, EUROPE)'
        required: false
        default: 'AUTO_ROTATE'
        type: choice
        options:
          - AUTO_ROTATE
          - ITALY
          - GREECE
          - SPAIN
          - ROMANIA
          - PORTUGAL
          - FRANCE
          - UK
          - EUROPE
          - ITALY,GREECE,SPAIN
      custom_stay_days:
        description: 'Hány napos legyen az út? (AUTO = Explore alapértelmezett, 0 = Egynapos reggel-este!)'
        required: false
        default: 'AUTO'
        type: choice
        options:
          - AUTO
          - '0'
          - '2'
          - '3'
          - '4'
      target_airport:
        description: '[Célzott Mód] Konkrét reptér IATA kód (pl. OTP Bukaresthez, BGY Milánóhoz - üresen hagyva régiós keresés)'
        required: false
        default: ''
        type: string
      target_dep_date:
        description: '[Célzott Mód] Indulási dátum (YYYY-MM-DD, pl. 2027-07-07)'
        required: false
        default: ''
        type: string
      target_ret_date:
        description: '[Célzott Mód] Visszaút dátuma (YYYY-MM-DD, pl. 2027-07-12)'
        required: false
        default: ''
        type: string

jobs:
  run-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Repository klónozása
        uses: actions/checkout@v4

      - name: Python 3.12 beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Függőségek telepítése
        run: pip install -r requirements.txt

      - name: Unit tesztek futtatása
        run: python -m unittest discover -s tests -v

      - name: SQLite adatbázis (data/flights.db) visszatöltése Cache-ből
        uses: actions/cache@v4
        with:
          path: data/flights.db
          key: flights-db-${{ github.run_id }}
          restore-keys: |
            flights-db-

      - name: ETL Pipeline futtatása
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEARCH_REGION: ${{ github.event.inputs.search_region || 'AUTO_ROTATE' }}
          CUSTOM_STAY_DAYS: ${{ github.event.inputs.custom_stay_days || '' }}
          TARGET_AIRPORT: ${{ github.event.inputs.target_airport || '' }}
          TARGET_DEP_DATE: ${{ github.event.inputs.target_dep_date || '' }}
          TARGET_RET_DATE: ${{ github.event.inputs.target_ret_date || '' }}
        run: python main.py